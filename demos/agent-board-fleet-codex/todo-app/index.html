<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="card-header">
      <p class="eyebrow">Stay on track</p>
      <h1>Todo Manager</h1>
      <p class="intro">A simple place for the things that matter today.</p>
    </header>

    <form id="todo-form" class="todo-form">
      <label class="visually-hidden" for="new-todo">New todo</label>
      <input
        id="new-todo"
        type="text"
        name="todo"
        placeholder="What needs doing?"
        autocomplete="off"
        required
      >
      <button id="add-btn" class="add-btn" type="submit">Add todo</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-label="Todo list"></ul>

    <footer class="card-footer">
      <p><span id="remaining-count" aria-live="polite">0</span> remaining</p>
      <button id="clear-done" class="clear-btn" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
